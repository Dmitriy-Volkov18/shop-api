services:

  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    ports:
      - "${REDIS_PORT}:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile

  nginx:
    ports:
      - "${NGINX_PORT}:80"

    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro