spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:shoppassword}


  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


  mail:
    host: smtp.gmail.com
    port: 587
    username: addition.19who@gmail.com
    password: dwdrhwvjavrvbpjv

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000





app:
  frontend-url: http://localhost:3000
  mail-from: Shop API <your_email@gmail.com>

jwt:
  secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32+_CHARS"
  access-expiration: 15m
  refresh-expiration: 30d
  max-sessions: 5

security:
  rate-limit:

    login:
      limit: 10
      window: 1m

    register:
      limit: 5
      window: 10m

    refresh:
      limit: 20
      window: 1m

    email-verification:
      limit: 3
      window: 10m

    password-reset:
      limit: 5
      window: 60m


redis:
  prefix: shop-api

shop:
  trending:
    period-days: 30
    purchase-weight: 10
    wishlist-weight: 3
    view-weight: 1

    rebuild-cron: "0 0 3 * * *"

  reservation:
    timeout: 15m
    cleanup-interval: 1m

  order:
    payment-timeout: 15m

discount:
  max-total-percent: 90



springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true



management:
  endpoints:
    web:
      exposure:
        include: health